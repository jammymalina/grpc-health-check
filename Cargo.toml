[package]
name = "grpc-health-check"
version = "0.3.0"
edition = "2024"

authors = ["Jakub Jantosik <jakub.jantosik@gmail.com>"]
description = "A health-check utility for grpc services."
license = "MIT"
readme = "README.md"
repository = "https://github.com/jammymalina/grpc-health-check"
keywords = ["grpc", "health", "monitoring", "cli", "utility"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.58", features = ["std", "derive", "env"], default-features = false }
prost = "0.14.3"
tokio = { version = "1.49.0", features = ["macros"], default-features = false }
tonic = "0.14.3"
tonic-prost = "0.14.3"

[build-dependencies]
anyhow = "1.0.101"
tonic-prost-build = "0.14.3"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
